<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#17345C"/><stop offset="1" stop-color="#070F1E"/></radialGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A4C6E"/><stop offset="1" stop-color="#1B2740"/></linearGradient>
    <linearGradient id="furDark" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1B2740"/><stop offset="1" stop-color="#0F1626"/></linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFF6E6"/><stop offset="1" stop-color="#E8D3B3"/></linearGradient>
    <linearGradient id="flameOuter" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#1448B8"/><stop offset=".55" stop-color="#2F8BFF"/><stop offset="1" stop-color="#8FE3FF"/></linearGradient>
    <linearGradient id="flameInner" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#7FD3FF"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <radialGradient id="iris" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#C9F5FF"/><stop offset=".35" stop-color="#3FA9FF"/><stop offset="1" stop-color="#0B2A7A"/></radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .bob{animation:bob 2.6s ease-in-out infinite;transform-origin:300px 470px}
      @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
      .tail{animation:tail 2.6s ease-in-out infinite;transform-origin:360px 420px}
      @keyframes tail{0%,100%{transform:rotate(-3deg) scale(1)}50%{transform:rotate(4deg) scale(1.04,1.07)}}
      .flick{animation:flick .9s ease-in-out infinite alternate;transform-origin:430px 380px}
      @keyframes flick{from{opacity:.75;transform:scale(.96)}to{opacity:1;transform:scale(1.03)}}
      .lid{animation:blink 4.5s infinite;transform-origin:center 232px;transform-box:fill-box;transform-origin:50% 50%}
      @keyframes blink{0%,92%,100%{transform:scaleY(0)}95%{transform:scaleY(1)}}
      .spark{animation:spark 2.2s ease-in-out infinite}
      .spark:nth-child(2){animation-delay:.7s}.spark:nth-child(3){animation-delay:1.3s}
      @keyframes spark{0%,100%{opacity:0;transform:translateY(0) scale(.6)}50%{opacity:1;transform:translateY(-14px) scale(1)}}
      .ring{animation:ring 6s linear infinite;transform-origin:300px 128px}
      @keyframes ring{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.bob,.tail,.flick,.lid,.spark,.ring{animation:none}}
    </style>
  </defs>

  <rect width="600" height="600" rx="36" fill="url(#bg)"/>
  <!-- stage glow + floor -->
  <ellipse cx="300" cy="500" rx="190" ry="40" fill="#2F8BFF" opacity=".25" filter="url(#softGlow)"/>
  <ellipse cx="300" cy="505" rx="150" ry="18" fill="#060B16" opacity=".55"/>

  <!-- floating letter ring -->
  <g class="ring" fill="#9FE4FF" font-family="Nunito, Arial Black, Arial" font-weight="900" font-size="18" text-anchor="middle" opacity=".55">
    <text x="300" y="60">A</text><text x="372" y="92">B</text><text x="392" y="160">C</text><text x="350" y="208">D</text><text x="250" y="208">E</text><text x="208" y="160">F</text><text x="228" y="92">G</text>
  </g>

  <g class="bob">
    <!-- ===== TAIL (behind) ===== -->
    <g class="tail">
      <path id="tp" d="M338 442 C 420 458, 468 380, 462 300 C 458 258, 480 236, 506 220" fill="none" stroke="#0A1222" stroke-width="88" stroke-linecap="round"/>
      <path d="M338 442 C 420 458, 468 380, 462 300 C 458 258, 480 236, 506 220" fill="none" stroke="url(#flameOuter)" stroke-width="72" stroke-linecap="round"/>
      <g class="flick" filter="url(#glow)">
        <path d="M352 436 C 420 446, 456 376, 452 304 C 450 266, 470 246, 494 230" fill="none" stroke="url(#flameInner)" stroke-width="26" stroke-linecap="round" opacity=".85"/>
      </g>
      <!-- flame tip -->
      <path d="M470 236 C 490 200, 520 190, 548 150 C 540 196, 560 214, 536 250 Z" fill="url(#flameOuter)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <path d="M494 232 C 506 212, 522 204, 536 184 C 532 208, 540 220, 528 236 Z" fill="url(#flameInner)" opacity=".9" filter="url(#glow)"/>
      <text x="458" y="350" font-family="Nunito, Arial Black, Arial" font-weight="900" font-size="44" fill="#0A1222" text-anchor="middle" transform="rotate(-8 458 350)">A</text>
      <text x="456" y="346" font-family="Nunito, Arial Black, Arial" font-weight="900" font-size="44" fill="#FFFFFF" text-anchor="middle" transform="rotate(-8 456 346)">A</text>
    </g>

    <!-- ===== BODY ===== -->
    <!-- back leg -->
    <ellipse cx="350" cy="440" rx="58" ry="48" fill="url(#furDark)" stroke="#0A1222" stroke-width="7"/>
    <!-- torso -->
    <path d="M225 300 C 215 360, 220 430, 260 468 C 300 500, 360 495, 385 455 C 410 410, 395 350, 360 310 C 320 265, 250 262, 225 300 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
    <!-- chest bib -->
    <path d="M258 330 C 240 380, 250 440, 290 470 C 320 480, 345 470, 355 440 C 352 400, 330 350, 300 325 C 285 315, 268 318, 258 330 Z" fill="url(#cream)" stroke="#0A1222" stroke-width="6"/>
    <!-- chest glyph -->
    <path d="M288 395 L303 420 L318 395" fill="none" stroke="#2F8BFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <!-- cel shadow on torso -->
    <path d="M365 330 C 395 370, 400 420, 380 455 C 395 405, 385 360, 355 322 Z" fill="#0F1626" opacity=".55"/>
    <!-- front legs -->
    <path d="M262 440 C 250 470, 252 495, 262 505 L 300 505 C 300 485, 296 460, 290 440 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
    <path d="M312 445 C 306 470, 308 492, 316 505 L 352 505 C 352 488, 348 465, 340 445 Z" fill="url(#furDark)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
    <!-- paws -->
    <ellipse cx="282" cy="505" rx="24" ry="11" fill="url(#cream)" stroke="#0A1222" stroke-width="6"/>
    <ellipse cx="334" cy="506" rx="22" ry="10" fill="url(#cream)" stroke="#0A1222" stroke-width="6"/>
    <!-- claws glow -->
    <g stroke="#7FD3FF" stroke-width="4" stroke-linecap="round" opacity=".9">
      <path d="M268 508 l-4 6 M282 509 l0 7 M296 508 l4 6"/>
    </g>

    <!-- ===== HEAD ===== -->
    <g>
      <!-- ears -->
      <path d="M196 182 L 236 110 L 268 196 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <path d="M330 196 L 364 108 L 404 184 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <path d="M214 180 L 236 134 L 254 190 Z" fill="#2F8BFF" opacity=".9"/>
      <path d="M346 190 L 364 132 L 386 180 Z" fill="#2F8BFF" opacity=".9"/>
      <path d="M222 178 L 236 150 L 246 186 Z" fill="#9FE4FF" opacity=".8"/>
      <path d="M352 186 L 364 150 L 378 178 Z" fill="#9FE4FF" opacity=".8"/>
      <!-- cheek tufts -->
      <path d="M196 262 L 160 282 L 200 292 L 176 318 L 222 306 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <path d="M404 262 L 440 282 L 400 292 L 424 318 L 378 306 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <!-- face -->
      <path d="M190 235 C 190 180, 240 158, 300 160 C 360 158, 410 180, 410 235 C 410 268, 390 290, 362 296 C 340 310, 322 334, 300 348 C 278 334, 260 310, 238 296 C 210 290, 190 268, 190 235 Z" fill="url(#fur)" stroke="#0A1222" stroke-width="7" stroke-linejoin="round"/>
      <!-- head highlight -->
      <path d="M232 190 C 255 170, 290 166, 318 172 C 285 176, 258 186, 240 206 Z" fill="#6E86B0" opacity=".45"/>
      <!-- cheek streaks -->
      <path d="M205 252 l26 6 M207 266 l24 2" stroke="#2F8BFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <path d="M395 252 l-26 6 M393 266 l-24 2" stroke="#2F8BFF" stroke-width="6" stroke-linecap="round" filter="url(#glow)"/>
      <!-- muzzle -->
      <path d="M266 266 C 268 298, 284 322, 300 334 C 316 322, 332 298, 334 266 C 318 276, 282 276, 266 266 Z" fill="url(#cream)" stroke="#0A1222" stroke-width="6" stroke-linejoin="round"/>
      <!-- nose + mouth -->
      <path d="M288 272 L 312 272 L 300 288 Z" fill="#0A1222"/>
      <path d="M300 288 C 300 300, 296 306, 286 306" fill="none" stroke="#0A1222" stroke-width="5" stroke-linecap="round"/>
      <path d="M300 288 C 300 300, 306 310, 322 304" fill="none" stroke="#0A1222" stroke-width="5" stroke-linecap="round"/>
      <!-- eyes -->
      <g>
        <ellipse cx="258" cy="232" rx="24" ry="27" fill="#FFFFFF" stroke="#0A1222" stroke-width="6"/>
        <ellipse cx="342" cy="232" rx="24" ry="27" fill="#FFFFFF" stroke="#0A1222" stroke-width="6"/>
        <ellipse cx="262" cy="236" rx="16" ry="20" fill="url(#iris)"/>
        <ellipse cx="338" cy="236" rx="16" ry="20" fill="url(#iris)"/>
        <ellipse cx="264" cy="238" rx="7" ry="13" fill="#0A1222"/>
        <ellipse cx="336" cy="238" rx="7" ry="13" fill="#0A1222"/>
        <circle cx="254" cy="224" r="6" fill="#FFFFFF"/>
        <circle cx="330" cy="224" r="6" fill="#FFFFFF"/>
        <circle cx="270" cy="246" r="3" fill="#FFFFFF" opacity=".8"/>
        <circle cx="346" cy="246" r="3" fill="#FFFFFF" opacity=".8"/>
        <!-- eyelids (blink) -->
        <rect x="232" y="204" width="54" height="0" rx="26" fill="#2C3C5B"><animate attributeName="height" values="0;0;56;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/></rect>
        <rect x="316" y="204" width="54" height="0" rx="26" fill="#2C3C5B"><animate attributeName="height" values="0;0;56;0;0" keyTimes="0;0.92;0.95;0.98;1" dur="4.5s" repeatCount="indefinite"/></rect>
        <!-- brows: confident -->
        <path d="M236 200 C 250 192, 268 192, 284 200" fill="none" stroke="#0A1222" stroke-width="7" stroke-linecap="round"/>
        <path d="M316 200 C 332 192, 350 192, 364 200" fill="none" stroke="#0A1222" stroke-width="7" stroke-linecap="round"/>
      </g>
      <!-- forehead glyph -->
      <path d="M286 186 L300 202 L314 186" fill="none" stroke="#9FE4FF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    </g>
  </g>

  <!-- sparkles -->
  <g fill="#9FE4FF" filter="url(#glow)">
    <path class="spark" d="M470 250 l5 12 12 5 -12 5 -5 12 -5 -12 -12 -5 12 -5z"/>
    <path class="spark" d="M150 300 l4 10 10 4 -10 4 -4 10 -4 -10 -10 -4 10 -4z"/>
    <path class="spark" d="M500 420 l4 9 9 4 -9 4 -4 9 -4 -9 -9 -4 9 -4z"/>
  </g>

  <!-- name plate -->
  <g font-family="Nunito, Arial Black, Arial" font-weight="900">
    <rect x="30" y="532" width="200" height="44" rx="14" fill="#0A1222" stroke="#2F8BFF" stroke-width="3"/>
    <text x="48" y="562" fill="#FFFFFF" font-size="22">VOX</text>
    <text x="110" y="562" fill="#9FE4FF" font-size="16" font-weight="700">聲紋狐 · No.01</text>
    <rect x="474" y="532" width="96" height="44" rx="14" fill="#2F8BFF"/>
    <text x="522" y="561" fill="#061020" font-size="18" text-anchor="middle">🔊 音</text>
  </g>
</svg>
