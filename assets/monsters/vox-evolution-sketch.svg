<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" font-family="Nunito, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0B1A2E"/><stop offset="1" stop-color="#061020"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#2A3646"/><stop offset="1" stop-color="#0F1722"/></linearGradient>
    <linearGradient id="tail" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#1E6FD9"/><stop offset="1" stop-color="#7FD3FF"/></linearGradient>
    <radialGradient id="eye"><stop offset="0" stop-color="#E9FBFF"/><stop offset=".45" stop-color="#4D95F0"/><stop offset="1" stop-color="#0B1A2E"/></radialGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <!-- fox head: angular, used by all three stages -->
    <symbol id="head" viewBox="-60 -70 120 120">
      <polygon points="-44,-58 -14,-26 18,-26 48,-58 40,-6 30,22 0,44 -30,22 -40,-6" fill="url(#body)" stroke="#4D95F0" stroke-width="2.5" stroke-linejoin="round"/>
      <polygon points="-44,-58 -14,-26 -34,-10" fill="#0F1722" stroke="#4D95F0" stroke-width="1.5"/>
      <polygon points="48,-58 18,-26 38,-10" fill="#0F1722" stroke="#4D95F0" stroke-width="1.5"/>
      <polygon points="-36,-50 -20,-30 -30,-18" fill="#1E6FD9" opacity=".8"/>
      <polygon points="40,-50 24,-30 34,-18" fill="#1E6FD9" opacity=".8"/>
      <!-- eyes -->
      <polygon points="-30,-4 -8,-10 -6,6 -26,10" fill="url(#eye)" filter="url(#glow)"/>
      <polygon points="30,-4 8,-10 6,6 26,10" fill="url(#eye)" filter="url(#glow)"/>
      <rect x="-17" y="-6" width="4" height="12" fill="#061020"/>
      <rect x="13" y="-6" width="4" height="12" fill="#061020"/>
      <!-- muzzle + nose -->
      <polygon points="-12,22 12,22 0,38" fill="#0F1722" stroke="#4D95F0" stroke-width="1.5"/>
      <polygon points="-6,20 6,20 0,28" fill="#7FD3FF"/>
      <!-- forehead glyph -->
      <polyline points="-10,-44 0,-30 10,-44" fill="none" stroke="#7FD3FF" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    </symbol>
    <symbol id="bodyShape" viewBox="-70 -40 140 120">
      <polygon points="-52,-10 -20,-36 36,-32 58,10 44,62 -10,72 -48,46" fill="url(#body)" stroke="#4D95F0" stroke-width="2.5" stroke-linejoin="round"/>
      <!-- chest plate -->
      <polygon points="-18,10 22,10 30,44 2,60 -24,44" fill="#0F1722" stroke="#1E6FD9" stroke-width="2"/>
      <polyline points="-6,22 2,36 10,22" fill="none" stroke="#7FD3FF" stroke-width="3" stroke-linecap="round"/>
      <!-- legs -->
      <polygon points="-40,44 -22,50 -30,86 -46,86" fill="#131C2A" stroke="#4D95F0" stroke-width="2"/>
      <polygon points="26,52 44,46 50,86 34,86" fill="#131C2A" stroke="#4D95F0" stroke-width="2"/>
      <rect x="-48" y="80" width="20" height="6" rx="2" fill="#4D95F0"/>
      <rect x="32" y="80" width="20" height="6" rx="2" fill="#4D95F0"/>
    </symbol>
  </defs>

  <rect width="1200" height="520" fill="url(#bg)"/>
  <!-- grid -->
  <g stroke="#1C4374" stroke-width="1" opacity=".35">
    <path d="M0 440 H1200 M0 480 H1200"/>
    <path d="M100 0 V520 M300 0 V520 M500 0 V520 M700 0 V520 M900 0 V520 M1100 0 V520"/>
  </g>
  <text x="40" y="48" fill="#EAF2FB" font-size="26" font-weight="900">01 聲紋狐 VOX</text>
  <text x="40" y="74" fill="#9FB6CF" font-size="14">字母島 · 音屬性 🔊 · 弱點：字 · 代表例句 “Every sound has a shape.”</text>

  <!-- ===== Stage 1: Vox ===== -->
  <g transform="translate(200,300)">
    <ellipse cx="0" cy="118" rx="80" ry="10" fill="#4D95F0" opacity=".18" filter="url(#glow2)"/>
    <!-- single tail -->
    <path d="M60 40 C 120 10, 130 -60, 90 -110 C 112 -40, 96 10, 56 56 Z" fill="url(#tail)" filter="url(#glow)"/>
    <text x="96" y="-70" fill="#061020" font-size="20" font-weight="900" transform="rotate(20 96 -70)">A</text>
    <use href="#bodyShape" x="-70" y="-40" width="140" height="120" transform="scale(0.9) translate(0,30)"/>
    <polygon points="-18,-26 18,-26 24,6 -24,6" fill="#1A2534" stroke="#4D95F0" stroke-width="2"/>
    <use href="#head" x="-60" y="-70" width="120" height="120" transform="scale(0.95) translate(-6,-40)"/>
  </g>
  <text x="200" y="455" text-anchor="middle" fill="#EAF2FB" font-size="18" font-weight="900">幼體 · Vox</text>
  <text x="200" y="476" text-anchor="middle" fill="#9FB6CF" font-size="13">單尾，尾上一個字母 · Lv 1–15</text>

  <!-- ===== Stage 2: Voxel ===== -->
  <g transform="translate(600,290)">
    <ellipse cx="0" cy="130" rx="110" ry="12" fill="#4D95F0" opacity=".2" filter="url(#glow2)"/>
    <!-- seven tails fan -->
    <g filter="url(#glow)">
      <path d="M50 40 C 150 30, 190 -40, 160 -120 C 160 -40, 130 20, 50 56 Z" fill="url(#tail)" opacity=".55"/>
      <path d="M50 40 C 140 10, 170 -70, 130 -140 C 140 -60, 120 0, 48 54 Z" fill="url(#tail)" opacity=".7"/>
      <path d="M50 40 C 120 -10, 130 -90, 90 -150 C 112 -70, 100 -10, 46 52 Z" fill="url(#tail)" opacity=".85"/>
      <path d="M50 40 C 100 -20, 90 -100, 50 -150 C 72 -80, 70 -20, 44 50 Z" fill="url(#tail)"/>
      <path d="M50 40 C 70 -20, 50 -100, 10 -140 C 40 -80, 50 -20, 42 50 Z" fill="url(#tail)" opacity=".85"/>
      <path d="M50 40 C 40 -10, 10 -80, -30 -120 C 10 -70, 30 -10, 40 48 Z" fill="url(#tail)" opacity=".7"/>
      <path d="M50 40 C 20 0, -20 -50, -60 -80 C -20 -40, 20 0, 38 46 Z" fill="url(#tail)" opacity=".55"/>
    </g>
    <g fill="#061020" font-size="16" font-weight="900">
      <text x="150" y="-95">S</text><text x="118" y="-112">H</text><text x="82" y="-122">A</text><text x="44" y="-124">P</text><text x="8" y="-114">E</text><text x="-28" y="-96">O</text><text x="-56" y="-66">N</text>
    </g>
    <use href="#bodyShape" x="-70" y="-40" width="140" height="120" transform="scale(1.1) translate(-8,28)"/>
    <polygon points="-26,-34 22,-34 30,6 -32,6" fill="#1A2534" stroke="#4D95F0" stroke-width="2"/>
    <use href="#head" x="-60" y="-70" width="120" height="120" transform="scale(1.15) translate(-14,-44)"/>
    <!-- shoulder blades -->
    <polygon points="-70,-10 -40,-30 -36,-6" fill="#1E6FD9" opacity=".9"/>
    <polygon points="48,-14 76,-34 80,-10" fill="#1E6FD9" opacity=".9"/>
  </g>
  <text x="600" y="455" text-anchor="middle" fill="#EAF2FB" font-size="18" font-weight="900">成體 · Voxel</text>
  <text x="600" y="476" text-anchor="middle" fill="#9FB6CF" font-size="13">七尾，肩甲展開 · Lv 16–35</text>

  <!-- ===== Stage 3: Voxarch ===== -->
  <g transform="translate(1000,280)">
    <ellipse cx="0" cy="140" rx="130" ry="14" fill="#7FD3FF" opacity=".22" filter="url(#glow2)"/>
    <!-- 26-ray aura of thin light tails -->
    <g stroke="url(#tail)" stroke-width="5" stroke-linecap="round" filter="url(#glow)" opacity=".9">
      <g id="ray"><line x1="40" y1="30" x2="150" y2="-130"/></g>
      <use href="#ray" transform="rotate(10 40 30)"/><use href="#ray" transform="rotate(20 40 30)"/><use href="#ray" transform="rotate(30 40 30)"/>
      <use href="#ray" transform="rotate(-10 40 30)"/><use href="#ray" transform="rotate(-20 40 30)"/><use href="#ray" transform="rotate(-30 40 30)"/>
      <use href="#ray" transform="rotate(-40 40 30)"/><use href="#ray" transform="rotate(-50 40 30)"/><use href="#ray" transform="rotate(-60 40 30)"/>
      <use href="#ray" transform="rotate(-70 40 30)"/><use href="#ray" transform="rotate(-80 40 30)"/><use href="#ray" transform="rotate(-90 40 30)"/>
      <use href="#ray" transform="rotate(40 40 30)"/>
    </g>
    <!-- letter ring halo -->
    <g transform="translate(-14,-128)">
      <circle r="58" fill="none" stroke="#7FD3FF" stroke-width="2" opacity=".7" filter="url(#glow)"/>
      <g fill="#7FD3FF" font-size="13" font-weight="900" text-anchor="middle">
        <text x="0" y="-62">A</text><text x="22" y="-58">B</text><text x="40" y="-46">C</text><text x="54" y="-28">D</text><text x="60" y="-6">E</text><text x="58" y="16">F</text><text x="48" y="36">G</text><text x="30" y="52">H</text><text x="8" y="62">I</text><text x="-14" y="62">J</text><text x="-34" y="52">K</text><text x="-50" y="36">L</text><text x="-60" y="16">M</text><text x="-62" y="-6">N</text><text x="-56" y="-28">O</text><text x="-42" y="-46">P</text><text x="-22" y="-58">Q</text>
      </g>
    </g>
    <use href="#bodyShape" x="-70" y="-40" width="140" height="120" transform="scale(1.3) translate(-16,26)"/>
    <polygon points="-34,-40 26,-40 36,8 -42,8" fill="#1A2534" stroke="#4D95F0" stroke-width="2"/>
    <use href="#head" x="-60" y="-70" width="120" height="120" transform="scale(1.35) translate(-20,-46)"/>
    <!-- armor spikes -->
    <polygon points="-96,-10 -58,-40 -50,-4" fill="#1E6FD9"/>
    <polygon points="60,-16 98,-46 104,-8" fill="#1E6FD9"/>
    <polygon points="-70,40 -40,20 -36,56" fill="#1E6FD9" opacity=".7"/>
  </g>
  <text x="1000" y="455" text-anchor="middle" fill="#EAF2FB" font-size="18" font-weight="900">完全體 · Voxarch</text>
  <text x="1000" y="476" text-anchor="middle" fill="#9FB6CF" font-size="13">26 條光尾全開，頭頂旋轉字母環 · Lv 36+</text>

  <!-- arrows -->
  <g stroke="#4D95F0" stroke-width="3" fill="#4D95F0" opacity=".8">
    <line x1="340" y1="300" x2="440" y2="300"/><polygon points="440,292 456,300 440,308"/>
    <line x1="760" y1="300" x2="840" y2="300"/><polygon points="840,292 856,300 840,308"/>
  </g>
  <text x="40" y="508" fill="#4B6682" font-size="12">原創角色設計 · 航向布里斯本 Phonimon 系列 · 畫風：酷系霓虹線稿，底色 #0B1A2E，音屬性光邊 #4D95F0</text>
</svg>
